<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB SCRIPT DEVELOPER</title>

<style>
body {
    margin: 0;
    font-family: monospace;
    background: black;
    color: #00ccff;
    overflow: hidden;
}

/* MATRIX */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -2;
}

/* GRID */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background:
        linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
}

/* HEADING */
.header {
    text-align: center;
    font-size: 26px;
    padding: 15px;
    text-shadow: 0 0 10px #00ccff, 0 0 25px #00ccff;
}

/* MAIN */
#home {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 70px);
}

/* BUTTON */
.btn {
    height: 10vh;
    margin: 8px 12px;
    border-radius: 12px;
    border: 1px solid #00ccff;
    background: rgba(0,0,0,0.7);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;

    transform: scale(0);
    animation: pop 0.4s ease forwards, float 3s infinite;
    animation-delay: var(--d), calc(var(--d) + 0.5s);

    box-shadow: 0 0 10px #00ccff;
}

/* DELAY */
.btn:nth-child(1) { --d: 0.1s; }
.btn:nth-child(2) { --d: 0.2s; }
.btn:nth-child(3) { --d: 0.3s; }
.btn:nth-child(4) { --d: 0.4s; }
.btn:nth-child(5) { --d: 0.5s; }

/* ANIMATION */
@keyframes pop { to { transform: scale(1); } }
@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0); }
}

/* INFO */
.info {
    margin: 10px;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    background: rgba(0,0,50,0.7);
    border: 1px solid #00ccff;
    box-shadow: 0 0 15px #00ccff;

    transform: scale(0);
    animation: pop 0.5s ease forwards, float 3.5s infinite;
    animation-delay: 0.6s, 1.1s;
}

/* JOIN */
.join-btn {
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #00ccff;
    background: black;
    color: #00ccff;
    cursor: pointer;
}
</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div class="header">⚡AB SCRIPT DEVELOPER⚡</div>

<div id="home">

    <div class="btn" onclick="playSound(); window.open('https://www.callbomberz.in/')">💣 SMS TOOL</div>

    <div class="btn" onclick="playSound(); window.open('https://t.me/Rootforcedatapro_bot')">📱 NUMBER INFO</div>

    <div class="btn" onclick="playSound(); window.open('https://webcam360.org/')">📷 CAMERA TOOL</div>

    <div class="btn" onclick="playSound(); window.open('https://t.me/+XbnkQCY7ROBhMTJl')">🧠 ALL INFO TOOL</div>

    <div class="btn" onclick="playSound(); window.open('https://t.me/HACKDEVLOPER1')">☎️ HACKER CONTACT</div>

    <div class="info">
        <h3>ALL HACKING TOOL</h3>
        <p>Join our channel for professional hacking learning</p>

        <div class="join-btn" onclick="playSound(); window.open('https://t.me/+XbnkQCY7ROBhMTJl')">
            🚀 JOIN CHANNEL
        </div>
    </div>

</div>

<!-- 🔊 SOUND -->
<audio id="clickSound" src="https://www.soundjay.com/buttons/beep-07.mp3"></audio>

<script>
function playSound() {
    document.getElementById("clickSound").currentTime = 0;
    document.getElementById("clickSound").play();
}

/* MATRIX */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];
for (let i = 0; i < columns; i++) drops[i] = 1;

function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.06)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ccff";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(draw, 35);
</script>

</body>
</html>
